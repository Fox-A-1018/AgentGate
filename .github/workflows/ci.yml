name: AgentGate CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,api]"

      - name: Run tests with coverage gate
        run: python -m pytest --cov=agentgate --cov-report=term --cov-fail-under=90

      - name: Check dashboard JavaScript syntax
        run: node --check src/agentgate/web/app.js
